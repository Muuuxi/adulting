<script type="module">// engine/tax.js
var FEDERAL = {
  standardDeduction: { single: 16100, joint: 32200 },
  // [lower bound of taxable income, marginal rate]
  brackets: {
    single: [[0, 0.1], [12400, 0.12], [50400, 0.22], [105700, 0.24], [201775, 0.32], [256225, 0.35], [640600, 0.37]],
    joint: [[0, 0.1], [24800, 0.12], [100800, 0.22], [211400, 0.24], [403550, 0.32], [512450, 0.35], [768700, 0.37]]
  }
};
var FICA = { socialSecurity: 0.062, wageBase: 184500, medicare: 0.0145, addlMedicare: 9e-3, addlThreshold: { single: 2e5, joint: 25e4 } };
var STATES = {
  NC: { id: "NC", name: "\u5317\u5361\u7F57\u6765\u7EB3", rate: 0.0399, standardDeduction: { single: 12750, joint: 25500 }, excludes401k: true, costOfLiving: { housing: 1, other: 1 }, propertyTax: 8e-3 },
  TX: { id: "TX", name: "\u5FB7\u514B\u8428\u65AF", rate: 0, standardDeduction: { single: 0, joint: 0 }, excludes401k: true, costOfLiving: { housing: 1.1, other: 1 }, propertyTax: 0.016 },
  PA: { id: "PA", name: "\u5BBE\u5915\u6CD5\u5C3C\u4E9A", rate: 0.0307, standardDeduction: { single: 0, joint: 0 }, excludes401k: false, costOfLiving: { housing: 0.95, other: 0.98 }, propertyTax: 0.014 }
};
var STATE = STATES.NC;
var LIMITS = { k401: 24500, k401CatchUp50: 8e3, ira: 7500, rothPhaseOut: { single: [153e3, 168e3], joint: [242e3, 252e3] } };
var r2 = (n) => Math.round(n * 100) / 100;
function federalIncomeTax(taxable, status = "single") {
  const b = FEDERAL.brackets[status];
  let tax = 0, marginal = b[0][1];
  const bands = [];
  for (let i = 0; i < b.length; i++) {
    const lo = b[i][0], hi = i + 1 < b.length ? b[i + 1][0] : Infinity;
    if (taxable <= lo) break;
    const amount = Math.min(taxable, hi) - lo;
    tax += amount * b[i][1];
    marginal = b[i][1];
    bands.push({ rate: b[i][1], amount: r2(amount), tax: r2(amount * b[i][1]) });
  }
  return { tax: r2(tax), marginal, bands };
}
function annualTax(wages, status = "single", stateId = "NC") {
  const st = STATES[stateId] || STATES.NC;
  const gross = wages.reduce((n, w) => n + w.gross, 0), pretax = wages.reduce((n, w) => n + w.pretax401k, 0);
  const agi = Math.max(0, gross - pretax);

  const fed = federalIncomeTax(fedTaxable, status);
  const stateBase = st.excludes401k ? agi : Math.max(0, gross);
  const stateTaxable = Math.max(0, stateBase - st.standardDeduction[status]);
  const state = r2(stateTaxable * st.rate);
  let ss = 0, med = 0;
  for (const w of wages) {

    ss += Math.min(w.gross, FICA.wageBase) * FICA.socialSecurity;
    med += w.gross * FICA.medicare;
  }
  const ficaWages = wages.filter((w) => w.fica !== false).reduce((n, w) => n + w.gross, 0);
  med += Math.max(0, ficaWages - FICA.addlThreshold[status]) * FICA.addlMedicare;
  const total = r2(fed.tax + state + ss + med);
  return {
    gross: r2(gross),
    pretax: r2(pretax),
    agi: r2(agi),
    fedTaxable: r2(fedTaxable),
    federal: fed.tax,
    marginal: fed.marginal,
    bands: fed.bands,
    stateId: st.id,
    stateTaxable: r2(stateTaxable),
    state,
    socialSecurity: r2(ss),
    medicare: r2(med),
    total,
    effective: gross > 0 ? total / gross : 0
  };
}
function rothLimit(magi, earned, status = "single", age = 30) {
  const [lo, hi] = LIMITS.rothPhaseOut[status];
  const base = Math.min(LIMITS.ira + (age >= 50 ? 1100 : 0), earned);
  if (magi <= lo) return Math.max(0, base);
  if (magi >= hi) return 0;
  return Math.max(0, Math.floor(base * (hi - magi) / (hi - lo) / 10) * 10);
}

      case "to-look":
        clearInterval(spinTimer);
        setup.page = "look";
        setup.lookStep = 3;
        return update();
      case "pull":
        return pull();
      case "slot-again":
        if (setup.rerolls >= 1) return;
        setup.rerolls++;
        setup.seed = setup.seed * 1103515245 + 12345 >>> 0;
        setup.tick = 0;
        setup.pulls = 0;
        setup.reels = REELS.map(() => null);
        return update(false);
      case "slot-next":
        setup.page = "path";
        setup.path = "work";
        return update();
      case "to-slot":
        setup.page = "slot";
        return update();
      case "path":
        setup.path = id;
        setup.name = document.querySelector("#player-name")?.value ?? setup.name;
        return update(false);
      case "diff":
        if (setup.pulls || setup.rerolls) return;
        if (setup.difficulty !== id) {
          setup.difficulty = id;
          setup.reels = REELS.map(() => null);
          setup.pulls = 0;
          clearInterval(spinTimer);
        }
        return update(false);
      case "start": {
        setup.name = document.querySelector("#player-name")?.value ?? setup.name;
        clearInterval(spinTimer);
        ui = freshUI();
        return commit(previewStart());
      }
      // navigation
      case "past-year":
        ui.pastAge = null;
        if (s2.phase !== "review") ui.page = "journal";
        return update();
      case "nav":
        ui.tourRested = null;
        ui.page = id;
        ui.pastAge = null;
        ui.menu = false;
        ui.tip = null;
        return update();
      case "close":
        ui.modal = null;
        ui.flow = null;
        return update(false);
      case "ledger":
        ui.modal = { kind: "ledger" };
        return update(false);
      // payday
      case "amt": {
        const k = b.dataset.key, p = draft(), cur = k.startsWith("extra:") ? p.extra?.[k.slice(6)] || 0 : p[k];
        setDraftAmount(k, cur + +b.dataset.d);
        return update(false);
      }
      case "pct": {
        const p = draft();
        p.k401Pct = Math.max(0, Math.min(0.25, Math.round((p.k401Pct + +b.dataset.d) * 100) / 100));
        if (p.byPct) pctToDollars(p);
        ui.autoNotes = null;
        return update(false);
      }
      case "creep":
        draft().lockLifestyle = b.checked;
        return update(false);
      case "living":
        draft().livingLoan = b.checked;
        return update(false);
      case "ask-self":
        ui.modal = null;
        return update(false);
      case "ask-pick": {
        const cur = draft(), r = answerPrompt({ ...s2, plan: cur }, id);
        ui.modal = null;
        ui.draft = { ...r.plan, lockLifestyle: cur.lockLifestyle, livingLoan: cur.livingLoan };
        if (cur.byPct) {
          ui.draft.pcts = pctsFromDollars({ ...s2, plan: ui.draft }, ui.draft);
          pctToDollars(ui.draft);
        }
        ui.autoNotes = r.notes;
        return update(false);
      }
      case "plan-clear":
        ui.draft = { ...draft(), emergency: 0, goal: 0, roth: 0, brokerage: 0, extra: {}, k401Pct: 0, pcts: {} };
        ui.autoNotes = null;
        return update(false);
      case "pk": {
        const k = b.dataset.key;
        setDraftPct(k, Math.round((draft().pcts?.[k] || 0) * 100) + +b.dataset.d);
        return update(false);
      }
      case "pmode":
        setMode(b.dataset.id === "pct");
        ui.autoNotes = null;
        return update(false);
      case "plan-confirm": {
        const next = confirmPlan(setPlan(s2, { ...draft(), repeated: isRepeat() }));
        ui.draft = null;
        ui.autoNotes = null;
        return commit(next);
      }
      case "xfer":
        commitStay(transfer(s2, ui.xfer.from, ui.xfer.to, ui.xfer.amount), `\u5DF2\u4ECE${ACCOUNT_NAMES[ui.xfer.from]}\u8F6C ${money2(ui.xfer.amount)} \u5230${ACCOUNT_NAMES[ui.xfer.to]}\u3002`);
        return update(false);
      case "payoff": {
        const d = s2.debts.find((x) => x.id === ui.pay.debt), amt = Math.min(ui.pay.amount, d.balance, s2.accounts[ui.pay.from]);
        commitStay(payDebt(s2, ui.pay.debt, ui.pay.amount, ui.pay.from), `\u5DF2\u7528${ACCOUNT_NAMES[ui.pay.from]}\u63D0\u524D\u8FD8 ${d.label} ${money2(amt)}\u3002`);
        return update(false);
      }
      // decision flow: pick → (choice / job) → mini-game → dice
      case "pick-decision":
        ui.modal = { kind: "decision", id };
        ui.flow = { source: "decision", id };
        return update(false);
      case "biz-q": {
        const F = ui.flow;
        if (F.bizChoice !== F.choice) {
          F.bizChoice = F.choice;
          F.bizA = [];
        }
        F.bizA = [...F.bizA, id];
        return update(false);
      }
      case "reflect-pick":
        s2 = answerReflect(s2, id);
        ls.set(SAVE_KEY, s2);
        ui.modal = null;
        return update(false);
      case "dec-go":
      case "dec-roll":
        ui.flow.result = null;
        return finishFlow(0);
      case "dec-game": {
        const d = decisions(s2).find((x) => x.id === ui.flow.id);
        ui.flow = { ...ui.flow, game: d.throw.game };
        ui.modal = { kind: "game" };
        return update(false);
      }
      case "game-stop":
        return gameRun?.stop();
      case "close-dice":
        ui.modal = null;
        ui.flow = null;
        notice = "";
        ui.page = "card";
        return update();
      // card
      case "draw":
        ui.flow = null;
        return commit(drawCard(s2));
      case "card-game":
        ui.flow = { source: "card", game: s2.card.game };
        ui.modal = { kind: "game" };
        return update(false);
      case "card-roll":
        ui.flow = { source: "card" };
        return finishFlow(0);
      case "card-opt": {
        const next = resolveCard(s2, id);
        ui.flow = null;
        notice = "";
        return commit(next);
      }
      case "live": {
        s2 = liveYear(s2);
        ls.set(SAVE_KEY, s2);
        ui.page = "live";
        ui.walk = { i: reduced ? 12 : 0 };
        update();
        return stepWalk();
      }
      case "walk-skip":
        if (ui.walk) {
          const R2 = s2.year?.review;
          ui.walk.i = R2 && R2.answered == null ? Math.max(ui.walk.i, R2.month) : 12;
        }
        update(false);
        return stepWalk();
      case "walk-done":
        clearTimeout(walkTimer);
        ui.walk = null;
        ui.page = "review";
        return update();
      case "lg": {
        const snd = ui.modal?.g && gameStep(ui.modal.g, id);
        if (snd) sfx(snd);
        return update(false);
      }
      case "lesson-ok":
        ui.modal = null;
        s2 = ackLesson(s2);
        ls.set(SAVE_KEY, s2);
        return update(false);
      case "rv-ans":
        s2 = answerReview(s2, +id);
        ls.set(SAVE_KEY, s2);
        sfx(s2.year.review.ok ? "good" : "bad");
        return update(false);
      case "rv-cont":
        ui.modal = null;
        update(false);
        return stepWalk();
      case "next-year": {
        const next = nextYear(s2);
        ui.draft = null;
        ui.pastAge = null;
        ui.slide = 0;
        return commit(next);
      }
      case "slide":
        ui.slide = Math.max(0, +id);
        return update();
    }
  } catch (err) {
    notice = err.message;
    update(false);
  }
});
document.querySelector("#save-file")?.addEventListener("change", async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  try {
    s2 = validate(JSON.parse(await f.text()));
    ls.set(SAVE_KEY, s2);
    ui = freshUI();
    notice = "\u5B58\u6863\u5DF2\u5BFC\u5165\u3002";
  } catch (err) {
    notice = "\u65E0\u6CD5\u5BFC\u5165\uFF1A" + err.message;
  }
  e.target.value = "";
  update();
});
update();
</script>
</body>
</html>
