        ui.draft = { ...r.plan, lockLifestyle: cur.lockLifestyle, livingLoan: cur.livingLoan };
        if (cur.byPct) {
          ui.draft.pcts = pctsFromDollars({ ...s2, plan: ui.draft }, ui.draft);
          pctToDollars(ui.draft);
        }
        ui.autoNotes = r.notes;
        return update(false);
      }
      case "plan-clear":
        ui.draft = { ...draft(), emergency: 0, goal: 0, roth: 0, brokerage: 0, extra: {}, k401Pct: 0, pcts: {} };
        ui.autoNotes = null;
        return update(false);
      case "pk": {
        const k2 = b.dataset.key;
        setDraftPct(k2, Math.round((draft().pcts?.[k2] || 0) * 100) + +b.dataset.d);
        return update(false);
      }
      case "pmode":
        setMode(b.dataset.id === "pct");
        ui.autoNotes = null;
        return update(false);
      case "plan-confirm": {
        const next = confirmPlan(setPlan(s2, { ...draft(), repeated: isRepeat() }));
        ui.draft = null;
        ui.autoNotes = null;
        return commit(next);
      }
      case "xfer":
        commitStay(transfer(s2, ui.xfer.from, ui.xfer.to, ui.xfer.amount), `Moved ${money2(ui.xfer.amount)} from ${ACCOUNT_NAMES[ui.xfer.from]} to ${ACCOUNT_NAMES[ui.xfer.to]}.`);
        return update(false);
      case "payoff": {
        const d = s2.debts.find((x) => x.id === ui.pay.debt), amt = Math.min(ui.pay.amount, d.balance, s2.accounts[ui.pay.from]);
        commitStay(payDebt(s2, ui.pay.debt, ui.pay.amount, ui.pay.from), `Paid ${money2(amt)} toward ${d.label} from ${ACCOUNT_NAMES[ui.pay.from]}.`);
        return update(false);
      }
      // decision flow: pick → (choice / job) → mini-game → dice
      case "pick-decision":
        ui.modal = { kind: "decision", id };
        ui.flow = { source: "decision", id };
        return update(false);
      case "biz-q": {
        const F = ui.flow;
        if (F.bizChoice !== F.choice) {
          F.bizChoice = F.choice;
          F.bizA = [];
        }
        F.bizA = [...F.bizA, id];
        return update(false);
      }
      case "reflect-pick":
        s2 = answerReflect(s2, id);
        ls.set(SAVE_KEY, s2);
        ui.modal = null;
        return update(false);
      case "dec-go":
      case "dec-roll":
        ui.flow.result = null;
        return finishFlow(0);
      case "dec-game": {
        const d = decisions(s2).find((x) => x.id === ui.flow.id);
        ui.flow = { ...ui.flow, game: d.throw.game };
        ui.modal = { kind: "game" };
        return update(false);
      }
      case "game-stop":
        return gameRun?.stop();
      case "close-dice":
        ui.modal = null;
        ui.flow = null;
        notice = "";
        ui.page = "card";
        return update();
      // card
      case "draw":
        ui.flow = null;
        return commit(drawCard(s2));
      case "card-game":
        ui.flow = { source: "card", game: s2.card.game };
        ui.modal = { kind: "game" };
        return update(false);
      case "card-roll":
        ui.flow = { source: "card" };
        return finishFlow(0);
      case "card-opt": {
        const next = resolveCard(s2, id);
        ui.flow = null;
        notice = "";
        return commit(next);
      }
      case "live": {
        s2 = liveYear(s2);
        ls.set(SAVE_KEY, s2);
        ui.page = "live";
        ui.walk = { i: reduced ? 12 : 0 };
        update();
        return stepWalk();
      }
      case "walk-skip":
        if (ui.walk) {
          const R2 = s2.year?.review;
          ui.walk.i = R2 && R2.answered == null ? Math.max(ui.walk.i, R2.month) : 12;
        }
        update(false);
        return stepWalk();
      case "walk-done":
        clearTimeout(walkTimer);
        ui.walk = null;
        ui.page = "review";
        return update();
      case "cg-play":
        ui.modal.cg.st = "play";
        return update(false);
      case "cg-skip": {
        const G = ui.modal.cg;
        return endCg(G, cgAuto(G.id, G.p, G.secs));
      }
      case "cg-stop":
        return cgRun?.stop();
      case "lg": {
        const snd = ui.modal?.g && gameStep(ui.modal.g, id);
        if (snd) sfx(snd);
        return update(false);
      }
      case "lesson-ok":
        ui.modal = null;
        s2 = ackLesson(s2);
        ls.set(SAVE_KEY, s2);
        return update(false);
      case "rv-ans":
        s2 = answerReview(s2, +id);
        ls.set(SAVE_KEY, s2);
        sfx(s2.year.review.ok ? "good" : "bad");
        return update(false);
      case "rv-cont":
        ui.modal = null;
        update(false);
        return stepWalk();
      case "next-year": {
        const next = nextYear(s2);
        ui.draft = null;
        ui.pastAge = null;
        ui.slide = 0;
        return commit(next);
      }
      case "slide":
        ui.slide = Math.max(0, +id);
        return update();
    }
  } catch (err) {
    notice = err.message;
    update(false);
  }
});
document.querySelector("#save-file")?.addEventListener("change", async (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  try {
    s2 = validate(JSON.parse(await f.text()));
    ls.set(SAVE_KEY, s2);
    ui = freshUI();
    notice = "Save imported.";
  } catch (err) {
    notice = "Couldn\u2019t import: " + err.message;
  }
  e.target.value = "";
  update();
});
update();
</script>
</body>
</html>
