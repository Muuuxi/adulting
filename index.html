<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4db3ea">
<title>Adulting · Tycoon Edition (English)</title>
<style>/* Adulting Miro Edition — "life board game" visual system.
   Inspired by the Miro storyboard: storybook Character Setup art, Life Journey lanes,
   wood-and-felt Roll tray, category colours (blue star / red alert / gold cart / grey). */
:root {
  --ink: #1d2b4f; --ink-2: #3a4a72; --muted: #5d6b8c;
  --sky: #4fb6ec; --sky-2: #bfe8ff; --sky-3: #e8f6ff;
  --sun: #ffc531; --sun-2: #ffe36b; --orange: #ff9f1c;
  --grass: #2fae6b; --grass-2: #c9f0d8;
  --blue: #2f6fe4; --blue-2: #dce8ff;
  --red: #e04848; --red-2: #ffe0dc;
  --gold: #f0a81c; --gold-2: #fff0c8;
  --quiet: #7d889c; --quiet-2: #e8ecf3;
  --felt: #21466d; --wood: #a5653a; --wood-2: #7c4a2a;
  --paper: #fffdf6; --card: #ffffff;
  --a1: #dcf3c4; --a2: #ffe6b3; --a3: #e7dbff;
  --st-Survival: #e04848; --st-Stability: #f0a81c; --st-Security: #2fae6b; --st-Optionality: #2f6fe4; --st-FI: #8a5cf0;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --lift: 0 5px 0 var(--ink);
  --lift-sm: 0 3px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: #e9f7ff; }
body {
  font-family: var(--font); color: var(--ink); font-size: 15px; line-height: 1.55;
  background: linear-gradient(180deg, #4db3ea 0, #8fd2f6 260px, #cdeeff 620px, #e9f7ff 100%);
  background-attachment: fixed; min-height: 100vh;
  font-variant-numeric: tabular-nums;
}
body::before { /* drifting cloud pattern */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background:
    radial-gradient(60px 26px at 8% 12%, #fff 98%, transparent 100%), radial-gradient(44px 22px at 12% 10%, #fff 98%, transparent 100%),
    radial-gradient(70px 28px at 78% 7%, #fff 98%, transparent 100%), radial-gradient(40px 20px at 83% 5%, #fff 98%, transparent 100%),
    radial-gradient(54px 22px at 55% 22%, #fff 98%, transparent 100%);
}
#app { position: relative; z-index: 1; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 900; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 10px; }
.page { max-width: 1320px; margin: 0 auto; padding: 0 18px 48px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  border: 3px solid var(--ink); border-radius: 999px; padding: .62em 1.3em; font-weight: 800;
  background: var(--card); box-shadow: var(--lift-sm); cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.big { font-size: 1.08rem; padding: .78em 1.6em; }
.btn.small { font-size: .85rem; padding: .35em .9em; border-width: 2.5px; }
.btn.wide { width: 100%; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.green { background: var(--grass); color: #fff; }
.btn.gold { background: linear-gradient(var(--sun-2), var(--sun)); }
.btn.red { background: var(--red); color: #fff; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { background: rgba(255, 255, 255, .7); }
.icon-btn { border: 3px solid var(--ink); background: #fff; border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; box-shadow: var(--lift-sm); }
.icon-btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 10px; z-index: 30; margin: 10px 0 18px; display: flex; align-items: center; gap: 14px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 6px 10px 6px 14px; box-shadow: var(--lift);
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand .logo.mini { width: 118px; height: auto; }
.brand span { font-size: .72rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 12px; border: 2.5px solid transparent; background: none; font-weight: 800; font-size: .9rem; cursor: pointer; }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab:not(.on):not(.locked):hover { border-color: var(--ink); background: var(--sky-3); }
.tab.locked { color: #9aa5bd; cursor: not-allowed; }
.tab.locked .ico:last-child { width: .85em; }
.who { display: flex; align-items: center; gap: 10px; }
.who-chip { display: flex; align-items: center; gap: 8px; border: 2.5px solid var(--ink); border-radius: 14px; padding: 3px 12px 3px 4px; background: var(--sun-2); }
.who-chip b { display: block; font-size: .88rem; line-height: 1.1; }
.who-chip small { font-size: .76rem; font-weight: 700; }
.avatar { display: block; }
.avatar.tiny { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; }
.avatar.mid { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ink); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 10px); width: 270px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--lift); padding: 8px; z-index: 40; }
.menu-item { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 0; background: none; border-radius: 10px; font-weight: 800; cursor: pointer; }
.menu-item:hover { background: var(--sky-3); }
.menu-item.danger { color: var(--red); }
.menu p { font-size: .76rem; color: var(--muted); padding: 6px 12px 2px; }
.toast { display: flex; gap: 10px; align-items: center; background: var(--gold-2); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; margin-bottom: 16px; box-shadow: var(--lift-sm); font-weight: 700; }
.toast > span { flex: 1; }
.hint { color: var(--muted); font-size: .86rem; }
.risk { color: #b3262b; font-weight: 700; font-size: .88rem; display: flex; gap: 6px; align-items: flex-start; }
.callout { display: flex; gap: 8px; align-items: center; background: #fff2f6; border: 2px dashed #e05a8a; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: .9rem; }

/* tokens = money chips */
.tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.token { background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 10px; box-shadow: 0 2px 0 var(--ink); }
.token small { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); }
.token b { font-size: 1.12rem; font-weight: 900; }
.token.gain { background: #e7f9ee; } .token.gain b { color: #13784a; }
.token.pay { background: #fff1ef; } .token.pay b { color: #b3262b; }

/* =========================================================
   CHARACTER SETUP
   ========================================================= */
.banner {
  position: relative; overflow: hidden; border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--lift);
  background: linear-gradient(180deg, #7fd0fb, #c9ecff 70%); min-height: 230px; display: grid;
  grid-template-columns: minmax(250px, 1.1fr) 1.4fr minmax(220px, .9fr); align-items: center; gap: 12px; padding: 16px 26px 0;
}
.banner .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 120px; }
.banner > div { position: relative; z-index: 1; }
.banner-logo .logo { width: 100%; max-width: 330px; filter: drop-shadow(0 4px 0 rgba(29, 43, 79, .15)); }
.tagline { display: inline-block; margin: -4px 0 26px 18px; background: var(--ink); color: #fff; font-weight: 800; font-size: .85rem; padding: 3px 12px; border-radius: 8px; transform: rotate(-3deg); }
.banner-title { text-align: center; margin-bottom: 52px; background: rgba(255, 253, 246, .92); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 18px; box-shadow: var(--lift-sm); }
.banner-title h1 { font-size: clamp(2rem, 4vw, 2.8rem); color: var(--ink); }
.banner-title p { max-width: 30em; margin: 8px auto 0; font-weight: 700; color: var(--ink-2); }
.banner-hero { align-self: end; display: flex; align-items: flex-end; justify-content: center; }
.banner-av { width: 190px; height: 198px; margin-bottom: -6px; }
.bubble { position: absolute; top: 18px; left: -6px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 8px 12px; font-weight: 900; font-size: .92rem; transform: rotate(-4deg); box-shadow: var(--lift-sm); }
.bubble::after { content: ""; position: absolute; right: 18px; bottom: -13px; border: 11px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.resume-strip { margin-top: 14px; display: flex; gap: 10px; align-items: center; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 14px; font-weight: 700; box-shadow: var(--lift-sm); }
.resume-strip span { flex: 1; }

.steps { display: grid; grid-template-columns: 1fr 34px 1.15fr 34px 1fr; align-items: stretch; margin-top: 22px; }
.step-arrow { pointer-events: none; display: grid; place-items: center; color: #6c3bd8; }
.step-arrow .ico { width: 30px; height: 30px; stroke-width: 3; }
.step-panel { min-width: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--lift); padding: 14px; display: flex; flex-direction: column; gap: 12px; transition: opacity .2s, filter .2s; }
.step-panel.waiting { opacity: .55; filter: saturate(.4); }
.step-panel > header { display: flex; gap: 10px; align-items: center; }
.step-panel .num { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; color: #fff; border: 3px solid var(--ink); flex: none; }
.s1 .num { background: #22b0c4; } .s2 .num { background: var(--orange); } .s3 .num { background: #7a4fe0; }
.step-panel h2 { font-size: 1.22rem; }
.step-panel header p { font-size: .86rem; color: var(--muted); font-weight: 600; }
.s1 { background: linear-gradient(#e6f8fb, var(--paper) 40%); }
.s2 { background: linear-gradient(#fff1d8, var(--paper) 40%); }
.s3 { background: linear-gradient(#efe6ff, var(--paper) 40%); }

.avatar-board { background: var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.board-title { color: #fff; text-align: center; font-weight: 800; }
.avatar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.av { padding: 0; border: 3px solid transparent; border-radius: 14px; background: #2a3c66; cursor: pointer; aspect-ratio: 1; overflow: hidden; transition: transform .12s; }
.av .avatar { width: 100%; height: 100%; }
.av:hover { transform: translateY(-2px); }
.av.on { border-color: var(--sun); box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--sun); }
.name-field { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; }
.name-field input { flex: 1; min-width: 0; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; font: inherit; font-weight: 700; background: #fff; color: var(--ink); }

.roll-stage { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: stretch; }
.hero-figure { border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: #ffe9a8; display: flex; align-items: flex-end; }
.hero-figure .avatar.big { width: 100%; height: auto; }
.start-card { border: 3px solid var(--ink); border-radius: 18px; background: #fff; overflow: hidden; display: flex; flex-direction: column; min-height: 210px; }
.start-card .vig svg { display: block; width: 100%; height: 86px; object-fit: cover; border-bottom: 3px solid var(--ink); }
.start-info { padding: 8px 12px 10px; }
.start-info .label { display: inline-block; background: var(--orange); color: #fff; font-weight: 900; padding: 2px 10px; border-radius: 8px; border: 2px solid var(--ink); margin-bottom: 6px; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: .86rem; font-weight: 600; }
.facts li { display: flex; gap: 6px; align-items: flex-start; }
.rolling .start-card { animation: jiggle .11s infinite alternate; }
@keyframes jiggle { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg) scale(1.01); } }
.mystery { flex: 1; display: grid; place-items: center; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 20px 14px 6px; background: repeating-linear-gradient(45deg, #fff8e2 0 10px, #fff 10px 20px); }
.card-back { aspect-ratio: 3/4; width: 100%; border: 3px solid var(--ink); border-radius: 12px; background: var(--ink); color: var(--sun); display: grid; place-items: center; font-size: 2rem; font-weight: 900; box-shadow: var(--lift-sm); }
.card-back:nth-child(1) { transform: rotate(-8deg); } .card-back:nth-child(3) { transform: rotate(8deg); }
.mystery-note { text-align: center; padding: 6px 0 12px; font-weight: 700; color: var(--muted); font-size: .86rem; background: #fff8e2; }

.signpost { position: relative; display: grid; gap: 10px; padding: 10px 0 18px; }
.signpost .post { position: absolute; left: 50%; top: 0; bottom: 0; width: 18px; transform: translateX(-50%); background: var(--wood); border: 3px solid var(--ink); border-radius: 6px; }
.sign { position: relative; z-index: 1; width: 78%; display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-weight: 900; color: #fff3df; cursor: pointer;
  background: linear-gradient(#c27a45, var(--wood)); border: 3px solid var(--ink); box-shadow: var(--lift-sm); transition: transform .12s; }
.sign.right { justify-self: end; clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%); padding-right: 34px; border-radius: 8px 0 0 8px; }
.sign.left { justify-self: start; clip-path: polygon(12% 0, 100% 0, 100% 100%, 12% 100%, 0 50%); padding-left: 34px; justify-content: flex-end; border-radius: 0 8px 8px 0; }
.sign:hover:not(:disabled) { transform: rotate(-2deg); }
.sign.on { background: linear-gradient(var(--sun-2), var(--sun)); color: var(--ink); }
.sign:disabled { cursor: not-allowed; filter: grayscale(.4); }
.accept-summary { display: flex; gap: 10px; align-items: center; background: #fff; border: 2.5px dashed var(--ink); border-radius: 14px; padding: 8px 12px; font-size: .9rem; }

.combos { margin-top: 26px; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--lift); padding: 16px; }
.combos header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 12px; }
.combos header p { color: var(--muted); font-size: .86rem; font-weight: 600; }
.combo-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.combo { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; padding-bottom: 10px; }
.combo .vig svg { display: block; width: 100%; height: 96px; border-bottom: 3px solid var(--ink); }
.combo h3 { font-size: 1.05rem; margin: 8px 12px 2px; }
.combo p { margin: 0 12px 8px; font-size: .84rem; color: var(--muted); font-weight: 600; }
.mini-tokens { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 12px; }
.mini-tokens span { font-size: .76rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 8px; padding: 1px 7px; background: #fff; }
.mini-tokens .gain { background: #e7f9ee; } .mini-tokens .pay { background: #fff1ef; }
.combo.mine { box-shadow: 0 0 0 4px var(--sun), var(--lift); transform: translateY(-3px); }
.ribbon { position: absolute; top: 10px; right: -6px; background: var(--red); color: #fff; font-weight: 900; font-size: .8rem; padding: 3px 12px; border: 2.5px solid var(--ink); border-radius: 6px 0 0 6px; z-index: 1; }

/* =========================================================
   LIFE JOURNEY
   ========================================================= */
.board { background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--lift); padding: 18px 18px 22px; }
.board-head { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.board-head h1 { font-size: 2rem; }
.board-head p { color: var(--muted); font-weight: 600; max-width: 32em; }
.legends { display: flex; flex-direction: column; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; font-weight: 700; }
.legend b { margin-right: 4px; font-size: .8rem; }
.sw { display: inline-flex; align-items: center; gap: 5px; }
.sw::before { content: ""; width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--ink); background: var(--c); }
.sw.st-Survival { --c: var(--st-Survival); } .sw.st-Stability { --c: var(--st-Stability); } .sw.st-Security { --c: var(--st-Security); } .sw.st-Optionality { --c: var(--st-Optionality); } .sw.st-FI { --c: var(--st-FI); }
.act { border: 2px solid var(--ink); border-radius: 10px; padding: 2px 8px; display: inline-flex; flex-direction: column; line-height: 1.25; }
.act small { font-weight: 600; color: var(--muted); }
.act.a1 { background: var(--a1); } .act.a2 { background: var(--a2); } .act.a3 { background: var(--a3); }
.act.now { box-shadow: var(--lift-sm); transform: translateY(-2px); }
.echo { margin-top: 12px; display: grid; gap: 6px; }
.echo p { display: flex; gap: 8px; align-items: center; background: var(--sky-3); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: .9rem; }

.lane-scroll { margin-top: 16px; overflow-x: auto; border: 3px solid var(--ink); border-radius: 20px; background: linear-gradient(90deg, var(--a1) 0 50%, #f6f1ff 50%); scrollbar-width: thin; }
.lane { position: relative; min-width: 1060px; height: 340px; margin: 0 60px; }
.season { position: absolute; top: 0; bottom: 0; }
.season.a1 { background: linear-gradient(var(--a1), #f3fbe9); } .season.a2 { background: linear-gradient(var(--a2), #fff6e1); } .season.a3 { background: linear-gradient(var(--a3), #f6f1ff); }
.ticks { position: absolute; top: 8px; left: 0; right: 0; height: 18px; }
.tick { position: absolute; transform: translateX(-50%); font-size: .72rem; font-weight: 800; color: var(--muted); }
.road { position: absolute; left: -40px; right: -40px; top: 150px; height: 30px; background: #6e7b95; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: repeating-linear-gradient(90deg, #fff 0 18px, transparent 18px 34px); }
.station { position: absolute; top: 0; height: 100%; transform: translateX(-50%); width: 0; display: flex; flex-direction: column; align-items: center; }
.stop { position: absolute; top: 146px; width: 38px; height: 38px; margin-left: -19px; left: 0; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; font-weight: 900; font-size: .9rem; z-index: 2; }
.station.upcoming .stop { border-style: dashed; color: var(--muted); }
.station.done .stop { background: var(--grass); color: #fff; }
.station.current .stop { background: var(--sun); width: 46px; height: 46px; margin-left: -23px; top: 142px; box-shadow: 0 0 0 6px rgba(255, 197, 49, .45); }
.station.passed .stop { background: #d9dfeb; }
.station.finale .stop { background: var(--ink); color: var(--sun); }
.st-label { position: absolute; top: 194px; width: 92px; left: -46px; text-align: center; font-size: .74rem; line-height: 1.25; }
.st-label b { display: block; font-size: 1rem; font-weight: 900; }
.st-label span { font-weight: 700; color: var(--ink-2); }
.station.row1 .st-label { top: 238px; }
.station.row1 .stop::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 48px; background: var(--ink); opacity: .35; }
.scenery { position: absolute; top: 40px; transform: translateX(-50%); height: 100px; display: flex; align-items: flex-end; opacity: .9; pointer-events: none; }
.st-label em { display: block; font-style: normal; margin-top: 3px; font-weight: 800; color: #13784a; }
.station.upcoming .st-label span { color: var(--muted); }
.pin { position: absolute; top: 98px; left: -17px; width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); border: 3px solid var(--ink); display: grid; place-items: center; color: #fff; }
.pin .ico { transform: rotate(45deg); width: 18px; height: 18px; }
.pin.cat-opportunity { background: var(--blue); } .pin.cat-life { background: var(--red); } .pin.cat-impulse { background: var(--gold); } .pin.cat-quiet { background: var(--quiet); }
.player { position: absolute; top: 58px; transform: translateX(-50%); z-index: 3; animation: hop 1.8s ease-in-out infinite; }
.player .token-av { width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: var(--lift-sm); }
.player::after { content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); border: 9px solid transparent; border-top-color: var(--ink); }
@keyframes hop { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
.yearband { position: absolute; left: 0; right: 0; top: 296px; height: 14px; }
.yr { position: absolute; top: 0; height: 14px; transform: translateX(-50%); border: 1.5px solid rgba(29, 43, 79, .35); background: rgba(255, 255, 255, .7); border-radius: 3px; }
.yr.ch { border-color: var(--ink); border-width: 2px; }
.yr.st-Survival { background: var(--st-Survival); } .yr.st-Stability { background: var(--st-Stability); } .yr.st-Security { background: var(--st-Security); } .yr.st-Optionality { background: var(--st-Optionality); } .yr.st-FI { background: var(--st-FI); }
.yearband-label { position: absolute; top: 314px; left: 0; font-size: .7rem; color: var(--muted); font-weight: 700; }

.turnbar { margin-top: 18px; display: grid; grid-template-columns: 1.05fr 1.25fr 1fr 1.05fr; gap: 14px; align-items: stretch; }
.turnbar > * { border: 3px solid var(--ink); border-radius: 18px; padding: 12px; background: #fff; box-shadow: var(--lift-sm); }
.turnbar small { font-weight: 800; color: var(--muted); font-size: .76rem; }
.tc { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.tc b { font-size: 1.1rem; display: block; }
.tc span { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-2); }
.cta-wrap { background: transparent !important; border: 0 !important; box-shadow: none !important; padding: 0 !important; display: flex; flex-direction: column; gap: 8px; }
.cta-board { flex: 1; min-height: 100px; width: 100%; border: 3px solid var(--ink); border-radius: 18px; cursor: pointer; font-size: 1.32rem; font-weight: 900; color: var(--ink); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px 16px;
  background: linear-gradient(180deg, var(--sun-2), var(--sun) 60%, var(--orange)); box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.cta-board:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
.cta-board:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.cta-board:disabled { background: #e3e7ef; color: var(--muted); cursor: default; }
.cta-board.done { background: var(--ink); color: var(--sun); }
.cta-wrap p { font-size: .8rem; color: var(--muted); font-weight: 600; text-align: center; }
.chapter-card b { display: block; font-size: 1.25rem; margin: 2px 0 4px; }
.chapter-card p { font-size: .88rem; font-weight: 600; color: var(--ink-2); }
.chapter-card.a1 { background: var(--a1); } .chapter-card.a2 { background: var(--a2); } .chapter-card.a3 { background: var(--a3); }
.wallet { display: flex; flex-direction: column; gap: 4px; }
.wl { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.wl span { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-2); }
.wl b { font-weight: 900; }
.wl.pay b { color: #b3262b; }
.stage-chip { margin-top: 4px; align-self: flex-start; font-size: .78rem; font-weight: 900; color: #fff; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--quiet); }
.stage-chip.st-Survival { background: var(--st-Survival); } .stage-chip.st-Stability { background: var(--st-Stability); color: var(--ink); } .stage-chip.st-Security { background: var(--st-Security); } .stage-chip.st-Optionality { background: var(--st-Optionality); } .stage-chip.st-FI { background: var(--st-FI); }

.memories { margin-top: 18px; }
.memories h2 { font-size: 1.1rem; margin-bottom: 8px; }
.memories ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.memories li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; background: #fff; border: 2.5px solid var(--ink); border-left-width: 10px; border-radius: 14px; padding: 8px 12px; }
.memories li.cat-opportunity { border-left-color: var(--blue); } .memories li.cat-life { border-left-color: var(--red); } .memories li.cat-impulse { border-left-color: var(--gold); } .memories li.cat-quiet { border-left-color: var(--quiet); }
.memories .age { font-weight: 900; font-size: 1.05rem; }
.memories li b { display: block; }
.memories li div span { display: inline-flex; gap: 5px; align-items: center; font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.memories .delta { font-weight: 800; font-size: .85rem; }
.empty { color: var(--muted); font-weight: 600; }

/* =========================================================
   MODALS (decision + event)
   ========================================================= */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20, 32, 64, .55); backdrop-filter: blur(2px); }
.modal.event { background: radial-gradient(circle, rgba(29, 43, 79, .07) 1.4px, transparent 1.6px) 0 0 / 20px 20px, var(--paper); }
.modal { position: fixed; z-index: 60; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1120px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink), 0 24px 60px rgba(0, 0, 0, .3); padding: 20px 22px; animation: pop .22s ease-out; outline: none; }
.modal.steady { animation: none; }
@keyframes pop { from { transform: translate(-50%, -46%) scale(.97); opacity: 0; } }
.m-head { position: relative; padding-right: 54px; margin-bottom: 16px; }
.m-head h2 { font-size: 1.7rem; margin-top: 6px; }
.m-head p { color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.m-head .icon-btn { position: absolute; top: 0; right: 0; }
.ribbon-tag { display: inline-block; background: var(--ink); color: var(--sun); font-weight: 900; font-size: .85rem; padding: 3px 12px; border-radius: 8px; }
.m-foot { margin-top: 18px; display: flex; gap: 14px; align-items: center; justify-content: flex-end; flex-wrap: wrap; border-top: 3px dashed rgba(29, 43, 79, .25); padding-top: 14px; }
.m-foot.center { flex-direction: column; justify-content: center; border-top: 0; }
.m-foot .detail { flex: 1; min-width: 260px; }
.m-foot .detail ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .9rem; }

/* decision spread */
.spread { display: flex; justify-content: center; gap: 14px; padding: 16px 4px 20px; flex-wrap: wrap; }
.life-card { --k: var(--quiet); --k2: var(--quiet-2); position: relative; width: 236px; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 0 0 12px; cursor: pointer; overflow: hidden;
  box-shadow: var(--lift); transform: rotate(calc(var(--i) * 2.2deg)) translateY(calc(var(--i) * var(--i) * 4px)); transition: transform .18s, box-shadow .18s; }
.life-card:hover { transform: rotate(0) translateY(-6px); z-index: 2; }
.life-card.picked { transform: rotate(0) translateY(-14px); box-shadow: 0 0 0 4px var(--sun), 0 12px 0 var(--ink); z-index: 3; }
.lc-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--k); color: #fff; font-weight: 900; border-bottom: 3px solid var(--ink); }
.lc-top .ico { width: 24px; height: 24px; }
.life-card h3 { font-size: 1.15rem; margin: 12px 14px 4px; }
.life-card p { margin: 0 14px 10px; font-size: .86rem; color: var(--ink-2); font-weight: 600; min-height: 2.8em; }
.lc-tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 14px; }
.lc-tokens span { font-size: .8rem; font-weight: 900; border: 2px solid var(--ink); border-radius: 8px; padding: 1px 8px; background: var(--k2); }
.lc-tokens .pay { background: #fff1ef; color: #9c1f24; } .lc-tokens .gain { background: #e7f9ee; color: #13784a; }
.life-card .lock { display: flex; gap: 6px; margin: 10px 14px 0; font-size: .8rem; font-weight: 800; color: #9c1f24; }
.life-card.blocked { background: repeating-linear-gradient(135deg, #fff 0 12px, #f4f5f8 12px 24px); }
.life-card.blocked .lc-top { filter: grayscale(.6); }
.k-home { --k: #ef7d3c; --k2: #ffe6d4; } .k-job { --k: var(--blue); --k2: var(--blue-2); } .k-study { --k: #7a4fe0; --k2: #ece4ff; } .k-wish { --k: #e05a8a; --k2: #ffe1ec; }
.k-care { --k: #e04848; --k2: var(--red-2); } .k-time { --k: #22b0c4; --k2: #dbf6fa; } .k-retirement { --k: #2fae6b; --k2: var(--grass-2); } .k-investment { --k: #13784a; --k2: var(--grass-2); } .k-keep { --k: #5d6b8c; --k2: var(--quiet-2); }

/* event steps */
.ev-steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 10px 0 0; }
.ev-steps li { font-size: .78rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; color: var(--muted); }
.ev-steps li.done { background: var(--grass-2); color: var(--ink); } .ev-steps li.on { background: var(--sun); color: var(--ink); }
.ev-steps + h2 { margin-top: 10px; }

/* the tray (wood + felt) */
.tray { margin: 6px auto 0; max-width: 680px; padding: 16px; border-radius: 26px; border: 4px solid var(--ink);
  background: linear-gradient(135deg, #c27a45, var(--wood) 40%, var(--wood-2)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .25), var(--lift); }
.felt { position: relative; height: 270px; border-radius: 16px; border: 3px solid var(--ink); overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #2d5d8c, var(--felt) 70%); box-shadow: inset 0 8px 18px rgba(0, 0, 0, .35); }
.deck { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.cardback { position: absolute; width: 130px; height: 182px; border-radius: 14px; border: 3px solid var(--ink); display: grid; place-items: center;
  background: repeating-linear-gradient(45deg, #2b3f6e 0 8px, #233661 8px 16px); box-shadow: 0 5px 0 rgba(0, 0, 0, .35); }
.cardback span, .face.back span { width: 58px; height: 58px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); display: grid; place-items: center; font-family: 'Arial Black', sans-serif; font-weight: 900; font-size: 1.6rem; color: var(--ink); }
.cardback.c0 { transform: translateX(-120px) rotate(-12deg); } .cardback.c1 { transform: translateX(-40px) rotate(-4deg); } .cardback.c2 { transform: translateX(40px) rotate(4deg); } .cardback.c3 { transform: translateX(120px) rotate(12deg); }
.deck:not(.revealed) .cardback { animation: idle 2.6s ease-in-out infinite; }
.deck .cardback.c1 { animation-delay: .2s; } .deck .cardback.c2 { animation-delay: .4s; } .deck .cardback.c3 { animation-delay: .6s; }
@keyframes idle { 50% { margin-top: -10px; } }
.cardback.ghost { opacity: .5; } .cardback.g0 { transform: translateX(-190px) rotate(-14deg); } .cardback.g1 { transform: translateX(190px) rotate(14deg); } .cardback.g2 { display: none; }
.flip { position: relative; width: 170px; height: 236px; perspective: 900px; transform-style: preserve-3d; animation: flipin 1s cubic-bezier(.3, 1.4, .5, 1) forwards; }
.flip.instant { animation: none; transform: rotateY(180deg); }
@keyframes flipin { 0% { transform: translateY(40px) rotateY(0) scale(.8); } 45% { transform: translateY(-24px) rotateY(0) scale(1.05); } 100% { transform: translateY(0) rotateY(180deg) scale(1); } }
.face { position: absolute; inset: 0; border-radius: 16px; border: 4px solid var(--ink); backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 10px; }
.face.back { background: repeating-linear-gradient(45deg, #2b3f6e 0 8px, #233661 8px 16px); }
.face.front { transform: rotateY(180deg); background: #fff; }
.face.front .emblem { width: 96px; }
.face.front b { font-size: 1.15rem; }
.face.front span { font-weight: 800; font-size: .9rem; }
.face.front em { font-style: normal; font-size: .76rem; font-weight: 800; background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 8px; }
.face.cat-opportunity { background: linear-gradient(#dce8ff, #fff 60%); } .face.cat-life { background: linear-gradient(#ffe0dc, #fff 60%); } .face.cat-impulse { background: linear-gradient(#fff0c8, #fff 60%); } .face.cat-quiet { background: linear-gradient(#e8ecf3, #fff 60%); }
.outcome { max-width: 680px; margin: 16px auto 0; display: flex; gap: 14px; align-items: center; justify-content: space-between; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; font-weight: 700; animation: rise .4s .8s both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.outcome.cat-opportunity { background: var(--blue-2); } .outcome.cat-life { background: var(--red-2); } .outcome.cat-impulse { background: var(--gold-2); } .outcome.cat-quiet { background: var(--quiet-2); }
.odds { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.odd { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .86rem; border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 12px; background: #fff; }
.odd.cat-opportunity { color: var(--blue); } .odd.cat-life { color: var(--red); } .odd.cat-impulse { color: #b07400; } .odd.cat-quiet { color: var(--quiet); }
.odd.fixed { color: var(--red); }

/* skill-check card */
.check-card { display: grid; grid-template-columns: 200px 1fr; border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; background: #fff; box-shadow: var(--lift); }
.cc-left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 16px; border-right: 3px solid var(--ink); text-align: center; }
.cc-left .emblem { width: 110px; }
.check-card.cat-opportunity .cc-left { background: var(--blue-2); } .check-card.cat-life .cc-left { background: var(--red-2); } .check-card.cat-impulse .cc-left { background: var(--gold-2); }
.cc-right { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.quotes > div { border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 10px; font-size: .86rem; }
.quotes ul { margin: 4px 0 0; padding-left: 1.1em; }
.answers { display: flex; gap: 10px; flex-wrap: wrap; }
.answer { flex: 1 1 180px; border: 3px solid var(--ink); border-radius: 14px; background: var(--sky-3); font-weight: 900; padding: 14px; cursor: pointer; box-shadow: var(--lift-sm); }
.answer:hover { background: var(--sun-2); }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.2rem; }
.verdict .ico { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); padding: 4px; }
.verdict.yes .ico { background: var(--grass); color: #fff; } .verdict.no .ico { background: var(--sun); }

/* response */
.respond { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 18px; align-items: start; }
.event-card { border: 4px solid var(--ink); border-radius: 20px; background: #fff; overflow: hidden; box-shadow: var(--lift); transform: rotate(-1.2deg); }
.ec-band { display: flex; align-items: center; gap: 8px; padding: 8px 14px; color: #fff; font-weight: 900; border-bottom: 3px solid var(--ink); }
.ec-band em { margin-left: auto; font-style: normal; background: #fff; color: var(--ink); border-radius: 8px; padding: 0 8px; border: 2px solid var(--ink); }
.event-card.cat-opportunity .ec-band { background: var(--blue); } .event-card.cat-life .ec-band { background: var(--red); } .event-card.cat-impulse .ec-band { background: var(--gold); } .event-card.cat-quiet .ec-band { background: var(--quiet); }
.ec-art { border-bottom: 3px solid var(--ink); background: var(--sky-3); }
.ec-art .scene { display: block; width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover; }
.event-card h3 { font-size: 1.3rem; margin: 12px 14px 4px; }
.event-card > p { margin: 0 14px 14px; font-weight: 600; color: var(--ink-2); }
.event-card .risk { margin: 0 14px 14px; }
.options { display: grid; gap: 10px; }
.option { display: grid; grid-template-columns: 40px 1fr; gap: 12px; text-align: left; border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 12px; cursor: pointer; box-shadow: var(--lift-sm); transition: transform .1s; }
.option:hover:not(:disabled) { transform: translateX(3px); }
.option.on { background: #fff8d9; box-shadow: 0 0 0 4px var(--sun), var(--lift-sm); }
.option:disabled { background: #f3f4f7; cursor: not-allowed; box-shadow: none; }
.opt-key { width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 900; background: var(--sky-2); }
.option.on .opt-key { background: var(--sun); }
.option b { font-size: 1.05rem; }
.option ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .88rem; color: var(--ink-2); }

/* shortfall */
.shortfall { border: 3px solid var(--ink); border-radius: 20px; background: #fff; overflow: hidden; }
.sf-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--red-2); border-bottom: 3px solid var(--ink); }
.sf-head .ico { width: 32px; height: 32px; color: var(--red); }
.sf-head b { display: block; color: #b3262b; font-size: 1.1rem; }
.sf-opt { padding: 14px 16px; border-bottom: 2px dashed rgba(29, 43, 79, .25); display: grid; gap: 8px; }
.sf-opt h3 { font-size: 1.08rem; }
.sf-opt .btn { justify-self: start; }
.shortfall > .hint { padding: 10px 16px; }

/* payday */
.payday { display: grid; gap: 18px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.slot { min-height: 96px; border: 3px dashed var(--ink); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(255, 255, 255, .6); }
.slot > span { font-weight: 900; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.slot em { color: var(--muted); font-style: normal; font-weight: 700; }
.slot.filled { border-style: solid; background: var(--grass-2); }
.pay-cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.pay-card { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 150px; padding: 16px 10px; border: 3px solid var(--ink); border-radius: 16px; background: linear-gradient(var(--sun-2), var(--sun)); font-weight: 900; cursor: pointer; box-shadow: var(--lift); }
.pay-card .ico { width: 30px; height: 30px; }
.pay-card:disabled { opacity: .3; box-shadow: none; }

/* review */
.m-head.complete { display: flex; gap: 14px; align-items: center; background: #e7f9ee; border: 3px solid var(--ink); border-radius: 18px; padding: 14px; }
.big-check { width: 64px; height: 64px; border-radius: 50%; background: var(--grass); color: #fff; border: 4px solid var(--ink); display: grid; place-items: center; flex: none; animation: pop .4s ease-out; }
.big-check .ico { width: 36px; height: 36px; stroke-width: 3; }
.review { display: grid; gap: 14px; }
.rv-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 10px 12px; display: grid; gap: 2px; }
.tile .ico { width: 24px; height: 24px; }
.tile small { font-weight: 800; color: var(--muted); }
.tile b { font-size: 1.05rem; }
.tile span { font-size: .85rem; font-weight: 600; }
.tile.cat-opportunity { background: var(--blue-2); } .tile.cat-life { background: var(--red-2); } .tile.cat-impulse { background: var(--gold-2); } .tile.cat-quiet { background: var(--quiet-2); }
.rv-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
.rv-grid section { border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 12px; }
.rv-grid h3 { font-size: 1rem; display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.pc { display: flex; justify-content: space-between; border-bottom: 1.5px dashed rgba(29, 43, 79, .2); padding: 4px 0; font-size: .9rem; font-weight: 600; }
.up { color: #13784a; } .down { color: #b3262b; }
.accounts table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.accounts th, .accounts td { padding: 5px 6px; text-align: right; border-bottom: 1.5px dashed rgba(29, 43, 79, .2); }
.accounts th:first-child { text-align: left; }
.accounts thead th { font-size: .76rem; color: var(--muted); }
.goal-line { display: flex; gap: 8px; align-items: center; font-weight: 700; background: var(--gold-2); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 12px; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.ledger section { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; background: #fff; font-size: .84rem; }
.ledger section div { display: flex; justify-content: space-between; }
.ledger h4 { font-size: .9rem; margin-bottom: 4px; }
.ledger small { color: var(--muted); }
.ledger details { grid-column: 1 / -1; }
.scroll { max-height: 260px; overflow: auto; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
.scroll table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.scroll td, .scroll th { padding: 3px 8px; border-bottom: 1px solid #e3e7ef; text-align: left; }

/* =========================================================
   SPENDING PLAN (year plan)
   ========================================================= */
.plan { background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--lift); padding: 18px; display: grid; gap: 16px; }
.plan-head { display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.plan-head h1 { font-size: 2rem; }
.plan-head p { color: var(--muted); font-weight: 600; }
.decision-token { display: flex; gap: 10px; align-items: center; background: var(--blue-2); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 14px; max-width: 420px; box-shadow: var(--lift-sm); }
.decision-token .ico { width: 28px; height: 28px; color: var(--blue); }
.decision-token small { display: block; font-weight: 800; color: var(--muted); font-size: .74rem; }
.decision-token b { display: block; }
.decision-token span { font-size: .82rem; font-weight: 600; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; padding: 16px; border: 3px solid var(--ink); border-radius: 20px;

/* ---------- responsive ---------- */

  .tab { white-space: nowrap; padding: 5px 9px; font-size: .82rem; }

  .banner { grid-template-columns: 1fr; padding: 14px 14px 0; }

  .turnbar { grid-template-columns: 1fr; }

  .m-head h2 { font-size: 1.35rem; }

  .cc-left { border-right: 0; border-bottom: 3px solid var(--ink); flex-direction: row; }
  .cc-left .emblem { width: 64px; }

  .event-card { transform: none; }
  .life-card { width: 100%; transform: none; }
  .life-card:hover, .life-card.picked { transform: none; }
  .felt { height: 220px; }

  .cardback.c0 { transform: translateX(-84px) rotate(-12deg); } .cardback.c1 { transform: translateX(-28px) rotate(-4deg); } .cardback.c2 { transform: translateX(28px) rotate(4deg); } .cardback.c3 { transform: translateX(84px) rotate(12deg); }
  .flip { width: 140px; height: 196px; }

  .m-foot { justify-content: stretch; }

}
@media (prefers-reduced-motion: reduce) {

}

.letter.best { box-shadow: 0 0 0 4px var(--grass), var(--lift-sm); }

.teaser { display: flex; flex-wrap: wrap; gap: 6px; }
.teaser span { font-size: .78rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 8px; padding: 1px 8px; background: var(--sky-3); }
.breakdown { display: grid; gap: 2px; }
.jr { display: flex; justify-content: space-between; gap: 8px; font-size: .86rem; font-weight: 600; border-bottom: 1.5px dashed rgba(29, 43, 79, .15); padding: 3px 0; }
.jr b { font-weight: 900; } .jr.net { background: var(--gold-2); border-radius: 8px; padding: 4px 6px; border-bottom: 0; } .jr.strong b { font-size: 1.05rem; }
.jr.up b { color: #13784a; } .jr.down b { color: #b3262b; }
.verdict-bar { display: flex; gap: 8px; align-items: flex-start; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; font-weight: 700; background: var(--sky-3); }
.verdict-bar.yes { background: #e7f9ee; } .verdict-bar.no { background: var(--gold-2); }
.verdict-bar .ico { width: 24px; height: 24px; flex: none; }
.modal.mg-host { width: min(1180px, calc(100vw - 32px)); }
@media (max-width: 760px) {
  .modal.mg-host { width: 100%; }
  .goal-strip { grid-template-columns: 1fr; }
  .fin-top { grid-template-columns: 1fr; }
  .months { height: 90px; gap: 2px; }

}

.rule-tag { display: inline-block; margin: 0 14px 8px; font-size: .72rem; font-weight: 900; background: var(--ink); color: var(--sun); border-radius: 6px; padding: 1px 8px; }

/* =========================================================
   Round 3: wizard setup, slot machine, quest HUD, arcade
   ========================================================= */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd { font: inherit; font-weight: 900; border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 6px; padding: 0 6px; background: #fff; }
.wiz-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 8px 0 16px; }
.wiz-head .wiz-logo { width: 190px; height: auto; }
.stage-bar { list-style: none; display: flex; gap: 8px; margin: 0; padding: 0; }
.stage-bar li { display: flex; align-items: center; gap: 6px; font-weight: 900; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; background: #fff; color: var(--muted); }
.stage-bar li span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--quiet-2); color: var(--ink); }
.stage-bar li.on { background: var(--sun); color: var(--ink); box-shadow: var(--lift-sm); } .stage-bar li.on span { background: #fff; }
.stage-bar li.done { background: var(--grass-2); color: var(--ink); } .stage-bar li.done span { background: var(--grass); color: #fff; }
.wiz { background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--lift); padding: 20px; }
.wiz-title h1 { font-size: 2rem; } .wiz-title p { color: var(--ink-2); font-weight: 600; margin-top: 4px; }

/* look creator */
.look-stage { display: grid; grid-template-columns: minmax(260px, 1fr) 1.4fr; gap: 22px; align-items: stretch; }
.mirror { border: 3px solid var(--ink); border-radius: 22px; background: linear-gradient(#7fd0fb, #c9ecff 70%, #8fd36b 70%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 20px 16px 14px; gap: 12px; box-shadow: var(--lift-sm); }
.mirror-av { width: min(300px, 100%); height: auto; filter: drop-shadow(0 6px 0 rgba(29, 43, 79, .25)); animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.mirror-note { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.mirror-note span { font-size: .8rem; font-weight: 900; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; background: rgba(255, 255, 255, .8); color: var(--muted); }
.mirror-note span.on { background: var(--sun); color: var(--ink); } .mirror-note span.done { background: var(--grass); color: #fff; }
.look-panel { display: flex; flex-direction: column; gap: 16px; }
.look-panel header { display: flex; gap: 12px; align-items: center; }
.look-panel .num { font-weight: 900; background: var(--ink); color: var(--sun); border-radius: 10px; padding: 4px 10px; }
.look-panel h1 { font-size: 2rem; } .look-panel header p { color: var(--muted); font-weight: 700; }
.look-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.look-opt { border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 6px 6px 8px; display: grid; gap: 4px; justify-items: center; cursor: pointer; box-shadow: var(--lift-sm); transition: transform .1s; font-weight: 800; font-size: .86rem; }
.look-opt:hover { transform: translateY(-2px); }
.look-opt.on { background: var(--sun-2); box-shadow: 0 0 0 4px var(--sun), var(--lift-sm); }
.look-opt .opt-av { width: 84px; height: 88px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); cursor: pointer; box-shadow: var(--lift-sm); position: relative; }
.swatch.big { width: 64px; height: 64px; }
.swatch.on { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); }
.swatch.on::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 1.2rem; text-shadow: 0 0 3px var(--ink), 0 0 2px var(--ink); }
.look-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; }
.confirm-tick { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--grass); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.confirm-tick .ico { width: 40px; height: 40px; stroke-width: 3.2; }
.confirm-tick:hover { transform: translateY(-2px) scale(1.04); }
.confirm-tick:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }

/* slot machine */
.slot-stage { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
.slot-stage .wiz-title, .slot-stage .look-foot { grid-column: 1 / -1; }
.cabinet { border: 4px solid var(--ink); border-radius: 28px; padding: 14px; background: linear-gradient(#ff6b5a, #e04848); box-shadow: inset 0 4px 0 rgba(255, 255, 255, .3), var(--lift); }
.marquee { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--ink); border-radius: 16px; padding: 6px 12px; margin-bottom: 12px; color: var(--sun); font-weight: 900; font-size: 1.1rem; border: 3px solid #ffd84d; }
.marquee .slot-logo { width: 110px; height: auto; }
.reels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.reel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 8px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.reel small { font-weight: 900; font-size: .9rem; }
.window { width: 100%; height: 82px; border: 3px solid var(--ink); border-radius: 12px; background: linear-gradient(#fff, #fff 40%, #e8ecf3); display: grid; place-items: center; overflow: hidden; position: relative; box-shadow: inset 0 6px 8px rgba(0, 0, 0, .15); }
.window b { font-size: 1.35rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.reel.is-spin .window b { animation: roll .14s linear infinite; filter: blur(.4px); }
@keyframes roll { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
.reel.is-stop .window { background: linear-gradient(#fff8d9, #ffe9a8); }
.reel.is-stop .window b { animation: land .35s cubic-bezier(.3, 1.6, .5, 1); color: var(--ink); }
@keyframes land { from { transform: translateY(-24px) scale(1.2); } }
.reel .range { font-size: .72rem; font-weight: 700; color: var(--muted); }
.stop-btn { width: 100%; border: 3px solid var(--ink); border-radius: 12px; background: var(--sun); font: inherit; font-weight: 900; padding: 8px 0; cursor: pointer; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; }
.stop-btn:disabled { background: var(--quiet-2); box-shadow: none; cursor: default; }
.reel.is-stop .stop-btn { background: var(--grass); color: #fff; }
.slot-side { display: grid; gap: 14px; }
.bands { border: 3px solid var(--ink); border-radius: 18px; background: #fff; padding: 12px 14px; display: grid; gap: 8px; }
.bands h2 { font-size: 1.05rem; }
.band { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 10px; background: var(--paper); }
.band b { grid-row: span 2; align-self: center; font-size: .95rem; } .band span { font-weight: 800; font-size: .86rem; } .band small { color: var(--muted); font-weight: 600; font-size: .78rem; }
.band.hit { background: var(--sun-2); box-shadow: 0 0 0 3px var(--sun); }
.id-card { border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(#e7f9ee, #fff 40%); padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; box-shadow: var(--lift); animation: pop .3s ease-out; min-width: 0; }
.slot-side, .slot-stage > * { min-width: 0; }
.id-card .name-field input { min-width: 0; width: 100%; }
.id-card > div { display: grid; gap: 8px; min-width: 0; }
.id-card .tokens { grid-template-columns: repeat(auto-fill, minmax(min(100%, 104px), 1fr)); }
.id-card .callout { min-width: 0; }
.id-card small { font-weight: 800; color: var(--muted); } .id-card h2 { font-size: 1.4rem; } .id-card p { font-weight: 700; font-size: .86rem; }
.id-card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.name-field.dark { color: var(--ink); }

/* goal pick */
.goal-stage { display: grid; gap: 16px; }
.goal-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.goal-opt { text-align: left; border: 3px solid var(--ink); border-radius: 18px; background: #fff; padding: 12px; display: grid; gap: 6px; align-content: start; cursor: pointer; box-shadow: var(--lift-sm); font: inherit; }
.goal-opt.on { background: var(--sun-2); box-shadow: 0 0 0 4px var(--sun), var(--lift-sm); }
.go-ico .ico { width: 30px; height: 30px; }
.go-amt { font-size: 1.15rem; line-height: 1.25; }
.go-title { font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.goal-opt ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: .8rem; font-weight: 800; }
.goal-opt ol i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .7rem; margin-right: 6px; }
.goal-opt small { color: var(--muted); font-weight: 700; }
.hud-preview { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .hud-preview > small { font-weight: 800; color: var(--muted); }

/* quest HUD in topbar */
.quest { display: flex; align-items: center; gap: 8px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; padding: 4px 10px; cursor: pointer; font: inherit; text-align: left; max-width: 300px; }
.quest > .ico { width: 24px; height: 24px; color: #b07400; flex: none; }
.quest b { display: block; font-size: .82rem; line-height: 1.2; }
.quest small { font-size: .72rem; font-weight: 800; color: var(--muted); }
.qbar { display: block; height: 7px; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--quiet-2); margin: 2px 0; min-width: 150px; }
.qbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--grass), #63d08f); }
.pity { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; font-weight: 800; font-size: .86rem; color: #6c3bd8; }

/* finance actions + arcade */
.fin-actions { margin-top: 16px; border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(90deg, #1f3a6b, #2f6fe4); color: #fff; padding: 12px 14px; display: grid; gap: 10px; box-shadow: var(--lift-sm); }
.fin-actions header { display: flex; gap: 10px; align-items: center; } .fin-actions header .ico { width: 28px; height: 28px; color: var(--sun); }
.fin-actions header b { display: block; } .fin-actions header span { font-size: .86rem; font-weight: 600; opacity: .9; }
.fa-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fa-card { text-align: left; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: #fff; color: var(--ink); cursor: pointer; display: grid; grid-template-columns: 44px 1fr; gap: 0 10px; box-shadow: 0 4px 0 var(--ink); font: inherit; }
.fa-card:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.fa-card .fa-ico { grid-row: span 2; font-size: 1.8rem; display: grid; place-items: center; border-radius: 12px; border: 2.5px solid var(--ink); }
.fa-card.shooter .fa-ico { background: var(--red-2); } .fa-card.coins .fa-ico { background: var(--gold-2); }
.fa-card small { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.modal.arcade-host { width: min(960px, calc(100vw - 32px)); }
.arena { border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: var(--lift); background: #1f3a6b; }
.arena canvas { display: block; width: 100%; height: min(460px, 62vh); touch-action: none; cursor: crosshair; }
.arc-setup { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.targets { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; align-content: start; }
.targets li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 10px; background: #fff; }
.targets .pri { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--sun); display: grid; place-items: center; font-weight: 900; }
.targets li.t-card { border-left: 10px solid var(--red); } .targets li.t-student { border-left: 10px solid var(--gold); } .targets li.t-arrears { border-left: 10px solid var(--quiet); }
.targets small { display: block; color: var(--ink-2); font-weight: 600; font-size: .8rem; }
.ammo { display: grid; gap: 8px; align-content: start; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: var(--paper); }
.ammo input { width: 110px; border: 2.5px solid var(--ink); border-radius: 10px; padding: 5px 8px; font: inherit; font-weight: 800; }
.arc-result { display: grid; gap: 6px; }
@media (max-width: 960px) {
  .look-stage, .slot-stage, .arc-setup { grid-template-columns: 1fr; }
  .goal-pick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quest { max-width: none; order: 4; width: 100%; }
}
@media (max-width: 560px) {
  .reels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .goal-pick, .fa-row { grid-template-columns: 1fr; }
  .id-card { grid-template-columns: minmax(0, 1fr); }
  .stage-bar li { padding-right: 10px; font-size: .86rem; }
  .wiz-head .wiz-logo { width: 140px; }
}

/* Adulting · Tycoon Edition (round 5) — on top of base.css. Designed to fit a normal desktop screen (1366×768 and up) without page scrolling on the main screens. */
:root { --st0: #7d889c; --st1: #e04848; --st2: #2f6fe4; --st3: #2fae6b; --st4: #f0a81c; --st5: #33b5c9; --st6: #8a5cf0; --pos: #13784a; --neg: #b3262b; }
.neg { color: var(--neg); } .pos { color: var(--pos); }
em.ok { color: var(--pos); font-style: normal; font-weight: 800; } em.warn { color: #b07400; font-style: normal; font-weight: 800; }
.pbar { display: block; height: 7px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--quiet-2); overflow: hidden; margin: 2px 0; min-width: 70px; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--grass), #63d08f); }
.pbar.fi i { background: linear-gradient(90deg, #8a5cf0, #c3a6ff); }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; box-shadow: var(--lift-sm); }
.panel h3 { display: flex; gap: 6px; align-items: center; font-size: .98rem; margin-bottom: 6px; }
.center { text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mini { font-size: .78rem; color: var(--ink-2); font-weight: 600; margin-top: 6px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: .86rem; padding: 2px 0; } .kv b { text-align: right; white-space: nowrap; }
.kv.small { font-size: .78rem; color: var(--ink-2); } .kv.total { border-top: 2px dashed rgba(29, 43, 79, .3); padding-top: 5px; margin-top: 3px; font-size: .95rem; }
.risk { color: var(--neg); font-weight: 700; font-size: .8rem; display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; }
.why { display: flex; gap: 4px; color: var(--neg); font-weight: 700; font-size: .74rem; }
.page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; } .page-head h1 { font-size: 1.4rem; } .page-head p { color: var(--ink-2); font-weight: 600; font-size: .86rem; }
.news { background: var(--ink); color: var(--sun); border-radius: 10px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
.q { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; background: #fff; color: var(--blue); font: 900 .7rem/1 var(--font); cursor: help; display: inline-grid; place-items: center; padding: 0; vertical-align: 1px; flex: none; }
.q:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
.tip { position: fixed; z-index: 90; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: var(--lift); display: grid; gap: 6px; font-size: .86rem; }
.tip b { font-size: .95rem; } .tip .btn { justify-self: end; }
.tour-spot { position: fixed; z-index: 95; border-radius: 14px; box-shadow: 0 0 0 4px var(--sun), 0 0 0 9999px rgba(15, 25, 50, .55); pointer-events: none; transition: all .2s; }
.tour-bubble { position: fixed; z-index: 96; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: var(--lift); display: grid; gap: 6px; }
.tour-bubble small { color: var(--muted); font-weight: 800; } .tour-bubble b { font-size: 1.05rem; } .tour-bubble p { font-size: .9rem; } .tour-bubble .row { justify-content: flex-end; }

/* ---------- setup: slot machine with a lever, path, goal ---------- */
.tycoon-slot { grid-template-columns: 1.4fr 1fr; }
.machine { display: flex; align-items: stretch; }
.machine .cabinet { flex: 1; }
.reels.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.reels.five .window b { font-size: 1.05rem; } .reel.is-idle .window b { color: var(--quiet); }
.lever-hint { text-align: center; color: #fff; font-weight: 900; margin-top: 10px; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.lever { position: relative; width: 78px; border: 0; background: none; cursor: pointer; padding: 0; }
.lever:disabled { cursor: default; opacity: .6; }
.lever .base { position: absolute; left: 0; top: 46%; width: 30px; height: 70px; background: #9aa5bd; border: 3px solid var(--ink); border-radius: 0 14px 14px 0; }
.lever .rod { position: absolute; left: 30px; top: 18%; width: 12px; height: 34%; background: linear-gradient(90deg, #e8ecf3, #9aa5bd); border: 3px solid var(--ink); border-radius: 6px; transform-origin: 50% 100%; }
.lever .knob { position: absolute; left: 16px; top: calc(18% - 34px); width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9b8f, #e04848 60%); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform .15s; }
.lever:hover:not(:disabled) .knob { transform: translateY(4px); }
.lever.yank .rod { animation: rod .35s ease-in-out; } .lever.yank .knob { animation: knob .35s ease-in-out; }
@keyframes rod { 50% { transform: scaleY(-1); } } @keyframes knob { 50% { transform: translateY(150px); } }
.lever.armed .knob { box-shadow: 0 0 0 6px rgba(255, 197, 49, .6), 0 4px 0 var(--ink); }
.slot-side.reveal { grid-column: 1 / -1; display: grid; gap: 10px; animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.backstory-card { border: 3px solid var(--ink); border-radius: 18px; background: linear-gradient(#fff7e0, #fff 50%); padding: 12px 14px; box-shadow: var(--lift); display: grid; gap: 6px; }
.backstory-card h2 { font-size: 1.4rem; } .backstory-card .facts { font-weight: 800; color: var(--ink-2); }
.slot-side .row { justify-content: space-between; }
.path-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.path-opt { text-align: left; border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; box-shadow: var(--lift-sm); font: inherit; align-content: start; }
.path-opt .ico { width: 26px; height: 26px; } .path-opt b { font-size: 1.05rem; } .path-opt > span { font-size: .84rem; } .path-opt small { font-weight: 800; color: var(--ink-2); }
.path-opt.on { background: var(--sun-2); box-shadow: 0 0 0 4px var(--sun), var(--lift-sm); }
.goal-pick.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.goal-stage { grid-template-columns: minmax(0, 1fr); gap: 10px; } .goal-stage > * { min-width: 0; }
.start-sum { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border: 3px solid var(--ink); border-radius: 16px; background: #fff; padding: 8px 12px; }
.start-sum .name-field { flex: 1 1 200px; min-width: 0; } .start-sum .name-field input { min-width: 0; width: 100%; }
.sum-line { font-weight: 700; }

/* ---------- game frame ---------- */
.page.tycoon { max-width: 1480px; padding-bottom: 0; }

.hud .q { width: 15px; height: 15px; font-size: .6rem; background: transparent; color: #bcd0f5; border-color: #bcd0f5; }

.lb-track { display: flex; gap: 2px; height: 10px; margin: 2px 0; } .lb-track i { flex: 1; border-radius: 2px; background: #3a5285; } .lb-track i.done { background: var(--grass); } .lb-track i.now { background: var(--sun); box-shadow: 0 0 0 2px #fff; }
.lb-ends { display: flex; justify-content: space-between; }
.hud-stat { padding: 0 4px; } .hud-stat .hud-sub { font-size: .7rem; font-weight: 700; color: #bcd0f5; } .hud-stat.wide { min-width: 110px; } .hud-stat b.neg { color: #ff9b8f; }

.tycoon-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: start; }

.side-item .ico { width: 20px; height: 20px; } .side-item:hover { background: rgba(255, 255, 255, .08); } .side-item.on { background: var(--sky); color: var(--ink); border-color: var(--ink); }

.idcard .q { width: 14px; height: 14px; font-size: .55rem; border-width: 1.5px; }
.pips { display: inline-flex; gap: 2px; vertical-align: middle; } .pips i { width: 12px; height: 8px; border-radius: 3px; background: var(--quiet-2); border: 1.5px solid var(--ink); } .pips i.on { background: var(--sun); }
.idcard dd em { font-style: normal; font-weight: 900; margin-left: 4px; }
.statuses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.st-chip { font-size: .7rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; background: var(--quiet-2); }

.phase-steps button:disabled { cursor: default; opacity: .6; }

.phase-steps li.done button { color: var(--pos); } .phase-steps li.done i { background: var(--grass); color: #fff; }
.continue { margin-top: 8px; }

/* ---------- payday: three columns on one screen ---------- */

.pd-flow .fl.minus b { color: var(--neg); } .pd-flow .fl.plus b { color: var(--pos); } .pd-flow .fl.warnline b { color: #b07400; }
.pd-flow .fl.sub { border-top: 2px solid var(--quiet-2); border-bottom: 2px solid var(--quiet-2); margin: 2px 0; padding: 4px 0; font-size: .92rem; }

.pd-mode button.on { background: var(--sun-2); } .pd-mode button:disabled { cursor: default; opacity: .6; }

.na { color: var(--muted); font-size: .78rem; font-weight: 700; }

.ty-stepper button { border: 0; background: var(--sky-3); font-weight: 900; font-size: 1rem; cursor: pointer; } .ty-stepper button:hover:not(:disabled) { background: var(--sun-2); }
.ty-stepper input, .ty-stepper output { border: 0; border-left: 1.5px solid var(--quiet-2); border-right: 1.5px solid var(--quiet-2); text-align: center; font: inherit; font-weight: 900; width: 100%; min-width: 0; padding: 0 2px; display: grid; place-items: center; font-size: .86rem; }
.ty-stepper.off { opacity: .55; }
.toggles { display: grid; gap: 4px; margin-top: 6px; font-size: .8rem; font-weight: 700; } .toggles label { display: flex; gap: 6px; align-items: center; }

.pd-foot .btn { padding: .45em 1em; }
.autonotes { display: flex; gap: 8px; margin-top: 8px; background: var(--gold-2); border: 2px dashed var(--ink); border-radius: 12px; padding: 6px 10px; font-size: .8rem; font-weight: 700; }
.autonotes ul { margin: 0; padding-left: 1.1em; }
.ladder-mini { margin-top: 8px; border-top: 2px dashed var(--quiet-2); padding-top: 6px; } .ladder-mini small { font-weight: 800; color: var(--muted); font-size: .74rem; }
.ladder-mini ol { margin: 4px 0 0; padding-left: 1.3em; font-size: .78rem; font-weight: 700; color: var(--ink-2); } .ladder-mini li.now { color: var(--ink); background: var(--sun-2); border-radius: 6px; font-weight: 900; }

/* ---------- decisions ---------- */

.dc-top { display: flex; gap: 6px; align-items: center; } .dc-top .ico { width: 22px; height: 22px; } .dc-top b { font-size: 1rem; }
.dc-text { font-size: .78rem; color: var(--ink-2); font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.throw-badge { display: inline-flex; gap: 4px; align-items: center; background: var(--blue-2); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font-size: .72rem; font-weight: 800; justify-self: start; }
.modal.small-modal { width: min(560px, calc(100vw - 32px)); } .modal.wide-modal { width: min(860px, calc(100vw - 32px)); } .modal.game-host { width: min(720px, calc(100vw - 32px)); }
.modal .m-head h2 { font-size: 1.4rem; } .modal { padding: 16px 18px; }

.choice input { width: 18px; height: 18px; } .choice:has(input:checked) { background: var(--sun-2); }

.arena.small canvas { display: block; width: 100%; height: 360px; touch-action: none; }
.dice-box { display: flex; gap: 14px; align-items: center; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; background: #fff; }
.dice-box .die { width: 70px; height: 70px; border: 4px solid var(--ink); border-radius: 16px; background: #fff; display: grid; place-items: center; font-size: 2.3rem; font-weight: 900; box-shadow: var(--lift); flex: none; }

.dice-box.fail .tier { background: var(--red-2); } .dice-box.ok .tier { background: var(--grass-2); } .dice-box.great .tier { background: var(--sun); }

.big-note { font-weight: 800; font-size: 1.05rem; margin-top: 10px; }

/* ---------- cards ---------- */
.deck-zone { display: grid; grid-template-columns: 180px minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 16px; box-shadow: var(--lift-sm); }
.pile { position: relative; width: 140px; aspect-ratio: 3/4; pointer-events: none; }
.pile i, .pile span { position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 14px; background: var(--ink); }

.pile span { display: grid; place-items: center; background: repeating-linear-gradient(45deg, #24365f 0 10px, #1d2b4f 10px 20px); } .pile .logo { width: 110px; }
.odds { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.odds li { display: grid; grid-template-columns: 24px 70px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-weight: 800; font-size: .88rem; } .odds li.hint { display: block; }
.odds .pbar { height: 10px; } .o-life .pbar i { background: var(--red); } .o-opportunity .pbar i { background: var(--blue); } .o-impulse .pbar i { background: var(--gold); } .o-quiet .pbar i { background: var(--quiet); }
.card-stage { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.ty-card { aspect-ratio: 3/4; border: 4px solid var(--ink); border-radius: 20px; padding: 14px; display: grid; align-content: start; gap: 8px; box-shadow: var(--lift); background: #fff; }
.ty-card header { display: flex; gap: 8px; align-items: center; font-weight: 900; letter-spacing: .06em; border-radius: 10px; padding: 6px 10px; color: #fff; } .ty-card header .ico { width: 26px; height: 26px; }
.t-life header { background: var(--red); } .t-opportunity header { background: var(--blue); } .t-impulse header { background: var(--gold); color: var(--ink); } .t-quiet header { background: var(--quiet); }
.t-life { background: linear-gradient(#fff, #ffe0dc); } .t-opportunity { background: linear-gradient(#fff, #dce8ff); } .t-impulse { background: linear-gradient(#fff, #fff0c8); }
.ty-card h2 { font-size: 1.45rem; } .ty-card p { font-weight: 600; }
.flip-in { animation: flip .5s ease-out; } @keyframes flip { from { transform: rotateY(90deg) scale(.9); } }
.card-side { display: grid; gap: 10px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 3px solid var(--ink); border-radius: 12px; background: #fff; padding: 7px 10px; cursor: pointer; display: grid; gap: 1px; box-shadow: var(--lift-sm); font: inherit; }
.opt:hover:not(:disabled) { background: var(--sun-2); } .opt small { color: var(--ink-2); font-weight: 700; font-size: .76rem; } .opt.blocked { background: var(--quiet-2); }
.judge p { font-size: .88rem; margin-bottom: 8px; }

/* ---------- review ---------- */
.ty-months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; margin-bottom: 10px; }
.ty-mo { border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; padding: 4px 5px; display: grid; gap: 1px; align-content: start; min-height: 74px; }
.ty-months.anim .ty-mo { animation: rise .3s ease-out both; animation-delay: calc(var(--i) * 70ms); }
.ty-mo small { font-weight: 900; color: var(--muted); font-size: .72rem; } .ty-mo b { font-size: .86rem; }
.ty-mo em { font-style: normal; font-size: .66rem; font-weight: 700; background: var(--sky-3); border-radius: 5px; padding: 0 3px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.stage-change { margin-top: 6px; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 10px; color: #fff; background: var(--st0); font-weight: 800; display: grid; font-size: .86rem; }
.stage-change b { font-size: 1.1rem; } .stage-change small { font-weight: 700; opacity: .9; }
.stage-change.st-1 { background: var(--st1); } .stage-change.st-2 { background: var(--st2); } .stage-change.st-3 { background: var(--st3); } .stage-change.st-4 { background: var(--st4); color: var(--ink); } .stage-change.st-5 { background: var(--st5); } .stage-change.st-6 { background: var(--st6); }
.ty-ledger { max-height: 60vh; overflow: auto; } .ty-ledger table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.ty-ledger td { padding: 2px 6px; border-bottom: 1px solid var(--quiet-2); } .ty-ledger td:last-child { text-align: right; font-weight: 800; }
.ty-ledger tr.t-shortfall td, .ty-ledger tr.t-overdue td, .ty-ledger tr.t-missed td, .ty-ledger tr.t-charge-off td, .ty-ledger tr.t-evicted td { color: var(--neg); }
.recap { max-width: 760px; margin: 0 auto; }

/* ---------- overview / accounts / goals / journal ---------- */
.ov-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; margin-bottom: 10px; }
.acct-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-bottom: 10px; align-items: start; }
.sheet-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.sheet li span { display: flex; gap: 4px; align-items: center; } .sheet li i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grass); order: 3; }
.sheet .owe li i { background: var(--red); } .sheet li b { text-align: right; }
.sheet-total { text-align: right; font-weight: 800; margin-top: 6px; border-top: 2px dashed var(--quiet-2); padding-top: 4px; } .sheet-total b { font-size: 1.2rem; }
.xfer { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 6px 0; } .xfer > b { width: 100%; }
.xfer label { display: grid; font-weight: 800; font-size: .76rem; gap: 2px; } .xfer select, .xfer input { border: 2px solid var(--ink); border-radius: 8px; padding: 4px 6px; font: inherit; font-weight: 800; background: #fff; max-width: 220px; } .xfer input { width: 90px; }
.stage-path ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.stage-path li { display: grid; gap: 4px; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 8px; background: #fff; opacity: .65; align-content: start; }
.stage-path li i { font-style: normal; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 900; border: 2px solid var(--ink); }
.stage-path li.st-1 i { background: var(--st1); } .stage-path li.st-2 i { background: var(--st2); } .stage-path li.st-3 i { background: var(--st3); } .stage-path li.st-4 i { background: var(--st4); } .stage-path li.st-5 i { background: var(--st5); } .stage-path li.st-6 i { background: var(--st6); }

function gameStep(g, act) {

      g.y = g.H;
    }
    return "soft";
  }
  if (g.id === "paycheck") {
    if (act.startsWith("guess:")) {
      g.guess = g.opts[+act.slice(6)];
      g.st = "gates";
      return "soft";
    }
    g.i++;
    if (g.i >= g.cuts.length) g.done = true;
    return g.done ? "good" : "coin";
  }
  if (g.id === "debt") {
    const extra = act === "pay:extra";
    g.prev = g.b;
    for (let k2 = 0; k2 < 6 && g.b > 0.5; k2++) {
      const i = g.b * g.apr / 12, due = Math.min(g.b + i, extra ? g.fixed : Math.max(25, i + g.b * 0.01));
      g.interest += i;
      g.b = g.b + i - due;
      g.m++;
    }
    if (g.m >= 36 || g.b <= 0.5) {
      g.done = true;
      g.b = Math.max(0, g.b);
      return g.b <= 0.5 ? "good" : "bad";
    }
    return extra ? "coin" : "bad";
  }
  if (act.startsWith("guess:")) {
    g.pick = +act.slice(6);
    g.st = "grow";
    return "soft";
  }
  g.py = g.y;
  g.y = Math.min(g.H, g.y + 10);
  if (g.y >= g.H) g.done = true;
  return g.done ? "levelup" : "tick";
}
